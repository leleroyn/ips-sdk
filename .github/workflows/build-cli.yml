name: build-cli

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "rust/**"
      - ".github/workflows/build-cli.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (static, musl)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Test
        run: cargo test --release --target x86_64-unknown-linux-musl

      - name: Smoke test
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/ips
          "$BIN" --version
          file "$BIN"

      - uses: actions/upload-artifact@v4
        with:
          name: ips-linux-x86_64
          path: rust/target/x86_64-unknown-linux-musl/release/ips

  windows-x86_64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Smoke test
        run: .\target\release\ips.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: ips-windows-x86_64
          path: rust/target/release/ips.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x86_64, windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "ips-*"
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ips-linux-x86_64/ips
            artifacts/ips-windows-x86_64/ips.exe